<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Subhan Ahmed developer profile terminal banner</title>
  <desc id="desc">A dark cyberpunk terminal interface with cyan and violet lighting, an animated scanning beam, circuit lines, and a profile boot sequence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="0.55" stop-color="#0D1022"/>
      <stop offset="1" stop-color="#160D2B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F5D4"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#00F5D4"/>
    </linearGradient>
    <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8FFFB"/>
      <stop offset="0.42" stop-color="#00F5D4"/>
      <stop offset="1" stop-color="#B69CFF"/>
    </linearGradient>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowViolet" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#91A0C2" stroke-opacity=".08"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { font-size: 13px; letter-spacing: 3px; }
      .boot { font-size: 15px; letter-spacing: 1px; }
      .circuit { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .circuit-cyan { stroke: #00F5D4; stroke-opacity: .75; }
      .circuit-violet { stroke: #8B5CF6; stroke-opacity: .7; }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(120px); } }
      @keyframes scan { from { transform: translateY(-30px); opacity: 0; } 15%, 85% { opacity: .55; } to { transform: translateY(450px); opacity: 0; } }
      @keyframes cursor { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
      .pulse { animation: pulse 3.4s ease-in-out infinite; }
      .pulse-delay { animation: pulse 3.4s ease-in-out .9s infinite; }
      .drift { animation: drift 7s ease-in-out infinite alternate; }
      .scan { animation: scan 7s ease-in-out infinite; }
      .cursor { animation: cursor 1.1s steps(1) infinite; }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .pulse-delay, .drift, .scan, .cursor { animation: none; }
        .scan { opacity: .12; transform: translateY(170px); }
      }
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="418" rx="17" fill="url(#grid)" stroke="url(#edge)" stroke-opacity=".65" stroke-width="2"/>
  <rect width="1200" height="420" rx="18" fill="url(#scanlines)"/>

  <g class="drift" opacity=".8">
    <path class="circuit circuit-cyan" stroke-width="2" d="M30 90H115l18-18h74M24 335h92l24-24h74"/>
    <path class="circuit circuit-violet" stroke-width="2" d="M1170 105h-76l-24 24h-70M1180 315h-110l-18 18h-50"/>
    <circle cx="207" cy="72" r="4" fill="#00F5D4" filter="url(#glowCyan)"/>
    <circle cx="214" cy="311" r="4" fill="#8B5CF6" filter="url(#glowViolet)"/>
    <circle cx="1000" cy="129" r="4" fill="#8B5CF6" filter="url(#glowViolet)"/>
    <circle cx="1002" cy="333" r="4" fill="#00F5D4" filter="url(#glowCyan)"/>
  </g>

  <g class="scan">
    <rect x="18" y="20" width="1164" height="2" fill="#00F5D4" filter="url(#glowCyan)"/>
  </g>

  <rect x="56" y="46" width="1088" height="328" rx="12" fill="#070A14" fill-opacity=".72" stroke="#263151" stroke-width="1"/>
  <path d="M56 91H1144" stroke="#263151"/>
  <circle cx="82" cy="69" r="6" fill="#FF5F57"/>
  <circle cx="103" cy="69" r="6" fill="#FFBD2E"/>
  <circle cx="124" cy="69" r="6" fill="#28C840"/>
  <text x="155" y="74" class="mono label" fill="#7180A8">profile://subhan-ahmed — secure shell</text>
  <text x="1092" y="74" class="mono label" text-anchor="end" fill="#00F5D4">ONLINE</text>

  <text x="92" y="139" class="mono boot" fill="#00F5D4">01</text>
  <text x="124" y="139" class="mono boot" fill="#B7C2DF">INITIALIZING PROFILE...</text>
  <text x="92" y="166" class="mono boot" fill="#8B5CF6">02</text>
  <text x="124" y="166" class="mono boot" fill="#B7C2DF">LOADING DEVELOPER DATA...</text>
  <text x="92" y="193" class="mono boot" fill="#00F5D4">03</text>
  <text x="124" y="193" class="mono boot" fill="#E8FFFB">SYSTEM ONLINE.</text>
  <rect x="294" y="180" width="9" height="18" fill="#00F5D4" class="cursor"/>

  <text x="600" y="246" class="mono" text-anchor="middle" font-size="54" font-weight="700" letter-spacing="8" fill="url(#titleGradient)" filter="url(#glowCyan)">SUBHAN AHMED</text>
  <text x="600" y="278" class="mono" text-anchor="middle" font-size="16" letter-spacing="4" fill="#AEB9D5">iOS DEVELOPER  //  SOFTWARE ENGINEER  //  AI EXPLORER</text>

  <g class="pulse">
    <rect x="92" y="320" width="11" height="11" rx="2" fill="#00F5D4" filter="url(#glowCyan)"/>
    <text x="116" y="330" class="mono label" fill="#B7C2DF">SWIFT / SWIFTUI</text>
  </g>
  <g class="pulse-delay">
    <rect x="356" y="320" width="11" height="11" rx="2" fill="#8B5CF6" filter="url(#glowViolet)"/>
    <text x="380" y="330" class="mono label" fill="#B7C2DF">APPLIED AI</text>
  </g>
  <g class="pulse">
    <rect x="568" y="320" width="11" height="11" rx="2" fill="#00F5D4" filter="url(#glowCyan)"/>
    <text x="592" y="330" class="mono label" fill="#B7C2DF">BUILD / LEARN / SHIP</text>
  </g>
  <path class="circuit circuit-violet" stroke-width="1" d="M940 325h82l16-16h82"/>
  <path class="circuit circuit-cyan" stroke-width="1" d="M940 339h48l13 13h92"/>
</svg>
